name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0
      - name: Build GUI
        run: wails build -s
      - name: Build CLI and mock
        run: |
          go build -trimpath -ldflags "-s -w" -o bin/asc-uploader-cli.exe ./cmd/asc-uploader-cli
          go build -trimpath -ldflags "-s -w" -o bin/asc-mock.exe ./cmd/asc-mock
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/asc-uploader-ui.exe
            bin/asc-uploader-cli.exe
            bin/asc-mock.exe
          generate_release_notes: true